name: PIID Benchmark & GitHub Pages Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  benchmark-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate evaluation specimens
        run: |
          python generate_samples.py --tier-size 10 --output samples.json

      - name: Run benchmark matrix
        run: |
          python run_benchmark.py --input samples.json --output benchmark_results.json

      - name: Upload benchmark JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-json
          path: benchmark_results.json

      - name: Compile HTML dashboards
        run: |
          mkdir -p dist
          python generate_report.py --input benchmark_results.json --output-dir dist
          cp benchmark_results.json dist/

      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
